services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxstamp
      POSTGRES_USER: ${DB_USER:-taxstamp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taxstamp}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/taxstamp
      DB_USER: ${DB_USER:-taxstamp}
      DB_PASSWORD: ${DB_PASSWORD:-taxstamp}
      SECRET_MTN: ${SECRET_MTN:-secret-mtn-a-changer}
      SECRET_MOOV: ${SECRET_MOOV:-secret-moov-a-changer}
      SECRET_CELTIIS: ${SECRET_CELTIIS:-secret-celtiis-a-changer}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
