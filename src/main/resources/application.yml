spring:
  application:
    name: paiement-timbre
  datasource:
    # LOCK_TIMEOUT : deux insertions concurrentes sur une même contrainte unique
    # attendent l'une l'autre au lieu d'échouer immédiatement.
    url: jdbc:h2:mem:taxstamp;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  jackson:
    deserialization:
      # Un champ inconnu (ex. "amount" envoyé par l'usager) est refusé, pas ignoré.
      fail-on-unknown-properties: true

payment:
  # Au-delà de ce délai sans résultat, le service interroge l'opérateur.
  status-check-delay: PT2M
  # Au-delà de ce délai, le débit encore en attente est annulé chez l'opérateur.
  expiry-delay: PT10M
  reconciliation:
    enabled: true
    interval: PT30S
  # Secrets HMAC partagés avec chaque opérateur (à surcharger par variables d'environnement en prod).
  operator-secrets:
    MTN: ${SECRET_MTN:secret-mtn-a-changer}
    MOOV: ${SECRET_MOOV:secret-moov-a-changer}
    CELTIIS: ${SECRET_CELTIIS:secret-celtiis-a-changer}

simulator:
  enabled: true
  # auto : le résultat est renvoyé tout seul après "result-delay"
  # manual : le résultat est déclenché via POST /simulator/transactions/{ref}/result
  mode: auto
  result-delay: PT3S
  # vide = http://localhost:{port du service}
  callback-url:

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taxstamp}
    username: ${DB_USER:taxstamp}
    password: ${DB_PASSWORD:taxstamp}
  jpa:
    hibernate:
      ddl-auto: update
